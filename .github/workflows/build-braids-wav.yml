name: Build Braids Firmware WAV

on:
  workflow_dispatch:
  push:
    branches:
      - benjaminam-octave-timeout

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi python3 python3-numpy

      - name: Build Braids and WAV
        run: |
          make -f braids/makefile wav

      - name: Verify WAV
        run: |
          python3 - <<'PY'
          import wave
          path = "build/braids/braids.wav"
          with wave.open(path, "rb") as w:
              print("Channels:", w.getnchannels())
              print("Sample width:", w.getsampwidth() * 8, "bit")
              print("Sample rate:", w.getframerate(), "Hz")
              print("Frames:", w.getnframes())
              print("Duration:", w.getnframes() / w.getframerate(), "seconds")
          PY

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: braids-mto-timeout
          path: |
            build/braids/braids.hex
            build/braids/braids.bin
            build/braids/braids.wav
